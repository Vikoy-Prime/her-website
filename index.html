<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KymGio Salon</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Montserrat", sans-serif;
            background: #11100f;
            color: white;
            overflow-x: hidden;

            transition:
                background 0.3s ease,
                color 0.3s ease;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {
            width: 100%;
            background: #0c0b0b;
            border-bottom: 1px solid rgba(255,255,255,0.08);

            position: relative;
            z-index: 100;
        }

        .header-inner {
            max-width: 1400px;
            margin: auto;

            padding: 18px 55px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {
            width: 145px;
            height: auto;
            object-fit: contain;
        }


        /* =========================================
           SALON NAME
        ========================================= */

        .brand-name {
            font-family: "Cormorant Garamond", serif;

            font-size: 32px;
            font-weight: 700;

            color: #ffffff;

            text-align: center;
            white-space: nowrap;
        }


        /* =========================================
           HAMBURGER
        ========================================= */

        .hamburger {
            width: 48px;
            height: 48px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            gap: 6px;

            background: transparent;
            border: none;
        }

        .hamburger span {
            width: 36px;
            height: 4px;

            background: #eaa15f;

            border-radius: 5px;

            transition: 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(7px, 7px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }


        /* =========================================
           HEADER ACTIONS
        ========================================= */

        .header-actions {
            max-width: 1400px;
            margin: auto;

            padding: 0 55px 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 28px;
        }


        /* =========================================
           THEME BUTTON
        ========================================= */

        .theme-btn {
            min-width: 175px;
            height: 70px;

            background: #11100f;

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 8px;

            color: white;

            font-size: 20px;
            font-weight: 500;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            transition: 0.3s ease;
        }

        .theme-btn:hover {
            border-color: #eaa15f;
        }

        .sun {
            font-size: 27px;
        }


        /* =========================================
           HEADER BOOK BUTTON
        ========================================= */

        .header-book {
            height: 70px;

            min-width: 400px;

            padding: 0 40px;

            border: none;

            border-radius: 8px;

            background: #e9a064;

            color: white;

            font-size: 21px;
            font-weight: 700;

            letter-spacing: 2px;

            transition: 0.3s ease;
        }

        .header-book:hover {
            transform: translateY(-2px);

            background: #f1aa6d;
        }


        /* =========================================
           MOBILE MENU
        ========================================= */

        .mobile-menu {
            position: absolute;

            top: 100%;

            right: 0;

            width: 280px;

            background: #141313;

            border: 1px solid rgba(255,255,255,0.08);

            padding: 25px;

            display: none;

            flex-direction: column;

            gap: 20px;
        }

        .mobile-menu.show {
            display: flex;
        }

        .mobile-menu a {
            font-size: 17px;

            padding: 12px;

            border-bottom: 1px solid rgba(255,255,255,0.08);

            transition: 0.2s;
        }

        .mobile-menu a:hover {
            color: #e9a064;
        }


        /* =========================================
           HERO
        ========================================= */

        .hero {
            position: relative;

            min-height: 1150px;

            overflow: hidden;

            background:
                linear-gradient(
                    rgba(44,40,37,0.78),
                    rgba(44,40,37,0.82)
                ),
                url("images/hero-background.jpg");

            background-size: cover;

            background-position: center;
        }


        /* =========================================
           DECORATIVE HAIR LINES
        ========================================= */

        .hero::after {
            content: "";

            position: absolute;

            left: -10%;
            right: -10%;

            bottom: 160px;

            height: 300px;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 45%,
                    rgba(234,161,95,0.10) 46%,
                    transparent 47%
                );

            opacity: 0.8;

            pointer-events: none;
        }


        /* =========================================
           SCISSOR / COMB DECORATION
        ========================================= */

        .tool-decoration {
            position: absolute;

            opacity: 0.18;

            pointer-events: none;
        }

        .scissors {
            left: -20px;
            top: 30px;

            width: 220px;

            transform: rotate(-20deg);
        }

        .comb {
            right: -30px;
            top: 40px;

            width: 330px;

            transform: rotate(45deg);

            opacity: 0.13;
        }


        /* =========================================
           HERO CONTENT
        ========================================= */

        .hero-content {
            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 900px;

            margin: auto;

            padding:

                205px
                25px
                0;

            text-align: center;
        }


        /* =========================================
           HERO TITLE
        ========================================= */

        .small-title {
            font-family: "Cormorant Garamond", serif;

            font-size: 52px;

            font-weight: 500;

            color: white;

            line-height: 1;
        }


        .main-title {
            margin-top: 20px;

            font-family: "Cormorant Garamond", serif;

            font-size: clamp(
                70px,
                8vw,
                110px
            );

            font-style: italic;

            font-weight: 700;

            line-height: 0.95;

            color: #eda162;

            white-space: nowrap;
        }


        /* =========================================
           DECORATIVE LINE
        ========================================= */

        .divider {
            margin: 35px auto;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 20px;
        }

        .divider-line {
            width: 115px;

            height: 2px;

            background: #eaa15f;
        }

        .scissor-icon {
            font-size: 26px;

            color: #eaa15f;
        }


        /* =========================================
           DESCRIPTION
        ========================================= */

        .hero-description {
            max-width: 650px;

            margin: auto;

            font-size: 26px;

            line-height: 1.7;

            color: rgba(255,255,255,0.75);

            font-weight: 400;
        }


        /* =========================================
           HERO BOOK BUTTON
        ========================================= */

        .hero-book {
            margin-top: 45px;

            padding: 18px 30px;

            min-width: 295px;

            height: 65px;

            border: none;

            border-radius: 7px;

            background: #eaa064;

            color: white;

            font-size: 16px;

            font-weight: 700;

            letter-spacing: 1.5px;

            transition: 0.3s ease;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.25);
        }

        .hero-book:hover {
            background: #f2aa6c;

            transform: translateY(-3px);
        }


        /* =========================================
           MAIN SALON IMAGE
        ========================================= */

        .hero-image {
            position: absolute;

            z-index: 3;

            left: 50%;

            bottom: -5px;

            transform: translateX(-50%);

            width: min(850px, 90%);

            height: auto;

            object-fit: contain;
        }


        /* =========================================
           LIGHT MODE
        ========================================= */

        body.light-mode {
            background: #f4f1ee;

            color: #222;
        }

        body.light-mode .header {
            background: #ffffff;

            border-color: rgba(0,0,0,0.08);
        }

        body.light-mode .brand-name {
            color: #222;
        }

        body.light-mode .theme-btn {
            background: #ffffff;

            color: #222;

            border-color: rgba(0,0,0,0.12);
        }

        body.light-mode .mobile-menu {
            background: white;

            color: #222;
        }

        body.light-mode .hero {
            background:
                linear-gradient(
                    rgba(245,241,237,0.72),
                    rgba(245,241,237,0.78)
                ),
                url("images/hero-background.jpg");

            color: #222;
        }

        body.light-mode .small-title {
            color: #222;
        }

        body.light-mode .hero-description {
            color: rgba(30,30,30,0.70);
        }


        /* =========================================
           DESKTOP
        ========================================= */

        @media (min-width: 900px) {

            .hamburger {
                display: none;
            }

            .header {
                display: flex;

                align-items: center;

                justify-content: space-between;

                padding: 15px 50px;
            }

            .header-inner {
                padding: 0;

                width: 100%;

                max-width: none;
            }

            .header-actions {
                padding: 0;

                margin-left: auto;

                margin-right: 30px;
            }

            .mobile-menu {
                display: none !important;
            }

            .hero-content {
                padding-top: 150px;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 899px) {

            .header-inner {
                padding: 18px 22px;
            }

            .logo {
                width: 155px;
            }

            .brand-name {
                font-size: 29px;
            }

            .header-actions {
                padding: 0 20px 25px;

                gap: 26px;
            }

            .theme-btn {
                height: 70px;

                min-width: 175px;

                font-size: 20px;
            }

            .header-book {
                min-width: 400px;
            }

            .hero {
                min-height: 1100px;
            }

            .hero-content {
                padding-top: 210px;

                padding-left: 20px;
                padding-right: 20px;
            }

            .small-title {
                font-size: 49px;
            }

            .main-title {
                font-size: 75px;

                white-space: normal;
            }

            .hero-description {
                font-size: 25px;

                line-height: 1.65;

                max-width: 600px;
            }

            .hero-image {
                width: 92%;

                bottom: 0;
            }

            .scissors {
                width: 180px;
            }

            .comb {
                width: 260px;
            }

        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 600px) {

            .header-inner {
                padding: 15px 18px 10px;
            }

            .logo {
                width: 145px;
            }

            .brand-name {
                font-size: 27px;
            }

            .hamburger {
                width: 45px;
            }

            .hamburger span {
                width: 34px;
            }

            .header-actions {
                padding:

                    8px
                    18px
                    20px;

                gap: 26px;
            }

            .theme-btn {
                min-width: 177px;

                height: 70px;

                font-size: 20px;
            }

            .header-book {
                min-width: 0;

                flex: 1;

                height: 70px;

                padding: 0 15px;

                font-size: 17px;

                letter-spacing: 1.7px;
            }

            .hero {
                min-height: 1120px;
            }

            .hero-content {
                padding-top: 205px;
            }

            .small-title {
                font-size: 47px;
            }

            .main-title {
                font-size: 66px;

                line-height: 0.92;

                margin-top: 18px;
            }

            .divider {
                margin: 34px auto;
            }

            .divider-line {
                width: 115px;
            }

            .hero-description {
                font-size: 24px;

                line-height: 1.7;
            }

            .hero-book {
                margin-top: 45px;

                min-width: 295px;

                height: 64px;

                font-size: 15px;
            }

            .hero-image {
                width: 94%;

                bottom: 0;
            }

            .scissors {
                left: -40px;

                top: 30px;

                width: 175px;
            }

            .comb {
                right: -70px;

                top: 40px;

                width: 270px;
            }

        }


        /* =========================================
           EXTRA SMALL PHONES
        ========================================= */

        @media (max-width: 390px) {

            .logo {
                width: 120px;
            }

            .brand-name {
                font-size: 23px;
            }

            .hamburger span {
                width: 30px;

                height: 3px;
            }

            .theme-btn {
                min-width: 130px;

                font-size: 16px;
            }

            .header-book {
                font-size: 14px;
            }

            .hero-content {
                padding-top: 190px;
            }

            .small-title {
                font-size: 40px;
            }

            .main-title {
                font-size: 56px;
            }

            .hero-description {
                font-size: 20px;
            }

            .hero-book {
                min-width: 260px;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">

        <div class="header-inner">

            <!-- LOGO -->
            <img
                src="images/logo.png"
                class="logo"
                alt="KymGio Salon Logo"
            >


            <!-- NAME -->
            <div class="brand-name">
                KymGio Salon
            </div>


            <!-- HAMBURGER -->
            <button
                class="hamburger"
                id="hamburger"
                aria-label="Open Menu"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>


        <!-- HEADER BUTTONS -->

        <div class="header-actions">

            <button
                class="theme-btn"
                id="themeToggle"
            >
                <span class="sun">☀️</span>
                <span id="themeText">Light</span>
            </button>


            <button
                class="header-book"
                onclick="bookAppointment()"
            >
                BOOK APPOINTMENT
            </button>

        </div>


        <!-- MOBILE MENU -->

        <nav
            class="mobile-menu"
            id="mobileMenu"
        >

            <a href="#home">
                Home
            </a>

            <a href="#services">
                Services
            </a>

            <a href="#about">
                About
            </a>

            <a href="#contact">
                Contact
            </a>

        </nav>

    </header>



    <!-- =====================================
         HERO
    ====================================== -->

    <main>

        <section
            class="hero"
            id="home"
        >


            <!-- Decorative scissors -->

            <img
                src="images/scissors.png"
                class="tool-decoration scissors"
                alt=""
            >


            <!-- Decorative comb -->

            <img
                src="images/comb.png"
                class="tool-decoration comb"
                alt=""
            >



            <!-- HERO CONTENT -->

            <div class="hero-content">


                <div class="small-title">
                    Beauty for
                </div>


                <h1 class="main-title">
                    Him &amp; Her
                </h1>


                <div class="divider">

                    <div class="divider-line"></div>

                    <div class="scissor-icon">
                        ✂
                    </div>

                    <div class="divider-line"></div>

                </div>


                <p class="hero-description">
                    Premium salon services
                    <br>
                    that bring out your best.
                </p>


                <button
                    class="hero-book"
                    onclick="bookAppointment()"
                >
                    BOOK YOUR APPOINTMENT
                </button>


            </div>



            <!-- MAIN HERO IMAGE -->

            <img
                src="images/salon-couple.png"
                class="hero-image"
                alt="KymGio Salon"
            >


        </section>

    </main>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>

        /* ==========================
           MOBILE MENU
        ========================== */

        const hamburger =
            document.getElementById("hamburger");

        const mobileMenu =
            document.getElementById("mobileMenu");


        hamburger.addEventListener(
            "click",
            function () {

                hamburger.classList.toggle("active");

                mobileMenu.classList.toggle("show");

            }
        );


        /* ==========================
           CLOSE MENU AFTER CLICK
        ========================== */

        document
            .querySelectorAll(".mobile-menu a")
            .forEach(function(link) {

                link.addEventListener(
                    "click",
                    function() {

                        hamburger
                            .classList
                            .remove("active");

                        mobileMenu
                            .classList
                            .remove("show");

                    }
                );

            });


        /* ==========================
           LIGHT / DARK MODE
        ========================== */

        const themeToggle =
            document.getElementById("themeToggle");

        const themeText =
            document.getElementById("themeText");


        themeToggle.addEventListener(
            "click",
            function() {

                document.body
                    .classList
                    .toggle("light-mode");


                if (
                    document.body
                        .classList
                        .contains("light-mode")
                ) {

                    themeText.textContent =
                        "Dark";

                } else {

                    themeText.textContent =
                        "Light";

                }

            }
        );


        /* ==========================
           APPOINTMENT BUTTON
        ========================== */

        function bookAppointment() {

            // Change this to your booking URL

            window.location.href =
                "#booking";

        }

    </script>


</body>
</html>
